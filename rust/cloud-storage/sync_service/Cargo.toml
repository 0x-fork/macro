[package]
edition = "2024"
name = "sync_service"
publish = false
version = "0.1.0"

[features]
default = []
inbound = ["dep:axum", "dep:utoipa"]
outbound = ["dep:sqlx"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true }
hex = { workspace = true }
s3_key = { path = "../s3_key" }
serde = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
