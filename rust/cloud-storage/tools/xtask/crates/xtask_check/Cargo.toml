[package]
description = "xtask check: single local quality gate (format + lint + code rules) scoped to changed files"
edition = "2024"
name = "xtask_check"
publish = false
version = "0.1.0"

[[bin]]
name = "xtask_check"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
console = "0.15"
serde_json = { workspace = true }
xtask_paths = { path = "../xtask_paths" }
xtask_stage = { path = "../xtask_stage" }
workspace-hack = { version = "0.1", path = "../../../../workspace-hack" }
