[package]
edition = "2024"
name = "coding_agent"
publish = false
version = "0.1.0"

[features]
default = ["toolset", "outbound"]
# Outbound adapters that talk to third-party coding-agent providers (Cursor, ...).
outbound = ["dep:reqwest"]
# The AI toolset that lets the Macro agent orchestrate coding agents.
toolset = ["dep:ai_toolset", "dep:schemars"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Webhook signature + routing-token verification (always available — used by the
# Cursor adapter and the framework-agnostic webhook receiver).
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = "2.6.1"

# toolset (AI tools)
ai_toolset = { path = "../ai_toolset", optional = true }
schemars = { workspace = true, optional = true }

# outbound (HTTP)
reqwest = { workspace = true, optional = true }

workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
macro_user_id = { path = "../macro_user_id" }
tokio = { workspace = true }
