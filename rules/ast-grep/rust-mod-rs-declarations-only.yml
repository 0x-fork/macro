id: rust-mod-rs-declarations-only
language: rust
severity: hint
message: mod.rs should only declare submodules and re-exports; move logic into its own module file.
note: |-
  See rust/cloud-storage/STYLE_GUIDE.md §5 (Architecture & module boundaries),
  mined from PR #4175. Define functions, types, and impls in a named module
  file and re-export from mod.rs if needed.
  Aspirational: ~246 existing mod.rs files violate this; apply it to new
  modules and to mod.rs files you are already refactoring.
files:
  - rust/**/mod.rs
rule:
  any:
    - kind: function_item
    - kind: struct_item
    - kind: enum_item
    - kind: trait_item
    - kind: impl_item
  inside:
    kind: source_file
