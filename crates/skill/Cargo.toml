[package]
edition = "2024"
name = "skill"
publish = false
version = "0.1.0"

[features]
ai_tools = ["dep:ai_toolset", "dep:async-trait", "dep:schemars", "inbound"]
default = ["ai_tools", "inbound", "outbound", "ports"]
inbound = [
  "dep:axum",
  "dep:entity_access",
  "dep:macro_authorization",
  "dep:model-error-response",
  "dep:models_permissions",
  "documents/document_create",
  "entity_access/inbound",
  "ports",
]
outbound = ["dep:sqlx", "ports"]
ports = []

[dependencies]
# Domain (always included)
attachment = { path = "../attachment" }
documents = { path = "../documents", default-features = false, features = [
  "document_create",
  "service",
] }
macro_user_id = { path = "../macro_user_id" }
model-entity = { path = "../model-entity" }
non_empty = { path = "../non_empty" }
rootcause = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

# AI tools (toolset adapter)
ai_toolset = { path = "../ai_toolset", optional = true }
async-trait = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Inbound (HTTP handlers)
axum = { workspace = true, optional = true }
entity_access = { path = "../entity_access", optional = true, default-features = false, features = [
  "ports",
] }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = [
  "axum",
] }
model-error-response = { path = "../model-error-response", optional = true }
models_permissions = { path = "../models_permissions", optional = true }

# Outbound (database adapters)
sqlx = { workspace = true, optional = true }

workspace-hack = { version = "0.1", path = "../workspace-hack" }
