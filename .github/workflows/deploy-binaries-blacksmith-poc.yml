# Proof-of-concept: build the deploy service binaries on Blacksmith runners,
# caching the Nix store on a Blacksmith sticky disk instead of (only) Cachix.
#
# Design (see discussion): a single `warm-deps` job builds the shared release
# dependency closure (`deployCargoArtifacts`) and commits it to the `/nix`
# sticky disk. The per-service `build-binaries` matrix then fans out, each job
# cloning the warm disk so the expensive shared deps are already in the store
# and only the service's own crate compiles.
#
# Cachix is kept wired as a *fallback* substituter (via setup-cachix) so a cold
# or evicted sticky disk pulls prebuilt artifacts rather than building from
# source. This workflow is additive and workflow_dispatch-only; it does not
# touch the production deploy path.
#
# PREREQUISITES before this can run green:
#   1. The Blacksmith GitHub app is installed on macro-inc/macro.
#   2. The runner label below matches a provisioned Blacksmith pool. Adjust
#      `blacksmith-8vcpu-ubuntu-2404` to whatever the org exposes.
#   3. The useblacksmith/stickydisk action is allowed by org actions policy.
name: "[PoC] Deploy Binaries on Blacksmith"

on:
  workflow_dispatch:
    inputs:
      cold-disk:
        description: "Delete the sticky disk first to measure a cold (Cachix-fallback) build"
        type: boolean
        required: false
        default: false

concurrency:
  group: blacksmith-poc-${{ github.ref }}
  cancel-in-progress: true

env:
  STICKY_DISK_KEY: ${{ github.repository }}-nix-store
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: Resolve service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Build matrix of services with deploy binaries
        id: set-matrix
        run: |
          set -euo pipefail
          services=$(jq -c '[.services | to_entries[] | select((.value.deploy_binaries // []) | length > 0) | .key]' .github/services-config.json)
          echo "matrix=${services}" >> "$GITHUB_OUTPUT"
          echo "Services with deploy binaries: ${services}"

  warm-deps:
    name: Warm shared Rust deps onto sticky disk
    needs: setup
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    # NOTE: adjust to a real provisioned Blacksmith runner label for the org.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: (optional) Reset sticky disk to force a cold build
        if: ${{ inputs.cold-disk }}
        continue-on-error: true
        uses: useblacksmith/stickydisk-delete@v1
        with:
          key: ${{ env.STICKY_DISK_KEY }}

      - name: Mount Nix store sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ env.STICKY_DISK_KEY }}
          path: /nix

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Configure Cachix fallback substituter
        uses: ./.github/actions/setup-cachix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET || secrets.SCCACHE_BUCKET }}

      - name: Build shared release dependency closure
        shell: bash
        run: |
          set -euo pipefail
          # Keep pushing to Cachix during migration so both tiers stay warm.
          if command -v cachix >/dev/null 2>&1 && [ -n "${CACHIX_CACHE_NAME:-}" ]; then
            cachix watch-store "$CACHIX_CACHE_NAME" &
            trap 'kill %1 2>/dev/null || true' EXIT
          fi
          nix build --print-build-logs ".#deployCargoArtifacts"
          echo "Shared deps realised into /nix/store and committed to sticky disk on job exit."

  build-binaries:
    name: Build ${{ matrix.service }} (warm disk)
    needs: [setup, warm-deps]
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        service: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mount Nix store sticky disk (clones warmed snapshot)
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ env.STICKY_DISK_KEY }}
          path: /nix

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Configure Cachix fallback substituter
        uses: ./.github/actions/setup-cachix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET || secrets.SCCACHE_BUCKET }}

      - name: Build service binaries
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          mkdir -p prebuilt
          # Deps should already be in /nix/store from the warm disk, so this
          # only compiles the service's own crate.
          nix build --print-build-logs ".#deploy-service-binaries-${SERVICE}"
          cp -r result/bin/* prebuilt/
          echo "Built binaries for ${SERVICE}:"
          ls -la prebuilt/

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poc-binaries-${{ matrix.service }}-${{ github.sha }}
          path: prebuilt/
          retention-days: 3

  summary:
    name: PoC summary
    needs: [setup, warm-deps, build-binaries]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "warm-deps:      ${{ needs.warm-deps.result }}"
          echo "build-binaries: ${{ needs.build-binaries.result }}"
          if [[ "${{ needs.warm-deps.result }}" == "failure" || "${{ needs.build-binaries.result }}" == "failure" ]]; then
            echo "❌ PoC build failed"
            exit 1
          fi
          echo "✅ Blacksmith sticky-disk build PoC completed"
