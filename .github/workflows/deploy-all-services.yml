name: Deploy All Services
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: 'dev'
        options:
          - dev
          - prod
        description: The environment we are deploying to.
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: The environment we are deploying to.
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      PULUMI_ACCESS_TOKEN:
        required: true
      DD_APP_KEY:
        required: true
      DD_API_KEY:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true
      AWS_ACCESS_KEY_ID:
        required: false
      SCCACHE_BUCKET:
        required: false

# Only run 1 deploy-all workflow at a time per environment
concurrency:
  group: ${{ github.workflow }}-all-services-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  setup:
    name: Setup Deployment Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      binaries: ${{ steps.set-matrix.outputs.binaries }}
      lambdas: ${{ steps.set-matrix.outputs.lambdas }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set deployment matrix
        id: set-matrix
        run: |
          set -euo pipefail
          cfg=.github/services-config.json
          # Full list drives deploy-services; the filtered lists keep each build
          # matrix to only the services that actually produce that artifact, so
          # no Blacksmith job spins up Nix + a sticky disk for nothing.
          services=$(jq -c '.services | keys' "$cfg")
          binaries=$(jq -c '[.services | to_entries[] | select((.value.deploy_binaries // []) | length > 0) | .key]' "$cfg")
          lambdas=$(jq -c '[.services | to_entries[] | select((.value.deploy_lambdas // []) | length > 0) | .key]' "$cfg")
          echo "matrix=${services}" >> "$GITHUB_OUTPUT"
          echo "binaries=${binaries}" >> "$GITHUB_OUTPUT"
          echo "lambdas=${lambdas}" >> "$GITHUB_OUTPUT"
          echo "All services: ${services}"
          echo "With binaries: ${binaries}"
          echo "With lambdas: ${lambdas}"

  # Warm the /nix sticky disk once, before either build matrix fans out:
  #   - deployCargoArtifacts: shared release deps for the crane-built binaries.
  #   - the dev shell closure: toolchain + cargo-lambda + just, so the lambda
  #     matrix gets an instant `nix develop`.
  # Both are committed to the same disk in a single job (a single committer
  # avoids the sticky-disk last-write-wins race between parallel writers).
  warm-deps:
    name: Warm shared deps + dev shell onto sticky disk
    needs: setup
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    # NOTE: adjust to a provisioned Blacksmith runner label for the org.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Mount Nix store sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-store
          path: /nix

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Configure Cachix fallback substituter
        uses: ./.github/actions/setup-cachix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET || secrets.SCCACHE_BUCKET }}

      - name: Warm shared deps and dev shell
        shell: bash
        run: |
          set -euo pipefail
          # Keep pushing to Cachix during migration so both cache tiers stay warm.
          if command -v cachix >/dev/null 2>&1 && [ -n "${CACHIX_CACHE_NAME:-}" ]; then
            cachix watch-store "$CACHIX_CACHE_NAME" &
            trap 'kill %1 2>/dev/null || true' EXIT
          fi
          # Shared release deps for the crane-built service binaries.
          nix build --print-build-logs ".#deployCargoArtifacts"
          # Dev shell closure so the lambda matrix gets an instant `nix develop`.
          nix develop --print-build-logs .# -c true
          echo "Shared deps + dev shell realised into /nix/store; committed on job exit."

  build-service-binaries:
    name: Build ${{ matrix.service }} binaries
    needs: [setup, warm-deps]
    if: ${{ needs.setup.outputs.binaries != '[]' }}
    # Runs on Blacksmith, cloning the warm /nix sticky disk committed by
    # warm-deps so only each service's own crate compiles.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        service: ${{ fromJson(needs.setup.outputs.binaries) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Mount Nix store sticky disk (clones warmed snapshot)
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-store
          path: /nix

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Configure Cachix fallback substituter
        uses: ./.github/actions/setup-cachix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET || secrets.SCCACHE_BUCKET }}

      - name: Build prebuilt binaries
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          mkdir -p prebuilt

          binaries=$(jq -r --arg service "$SERVICE" '.services[$service].deploy_binaries // [] | @tsv' .github/services-config.json)
          if [[ -n "$binaries" ]]; then
            if command -v cachix >/dev/null 2>&1; then
              cachix watch-store "$CACHIX_CACHE_NAME" &
              cachix_pid=$!
              trap 'kill "$cachix_pid" || true' EXIT
            else
              echo "::warning::Cachix is unavailable; skipping Cachix store uploads."
            fi

            nix build ".#deploy-service-binaries-${SERVICE}"
            cp -r result/bin/* prebuilt/
            mkdir -p prebuilt/nix-store
            while IFS= read -r store_path; do
              cp -a "$store_path" prebuilt/nix-store/
            done < <(nix-store -qR result)
          else
            echo "No deploy binaries configured for $SERVICE; uploading an empty artifact"
          fi

          touch prebuilt/.keep
          tar -C prebuilt -czf prebuilt-binaries.tar.gz .

      - name: Upload prebuilt binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-storage-service-binaries-${{ matrix.service }}-${{ github.sha }}
          path: prebuilt-binaries.tar.gz
          retention-days: 7

  build-lambda-artifacts:
    name: Build ${{ matrix.service }} Lambda artifacts
    needs: [setup, warm-deps]
    if: ${{ needs.setup.outputs.lambdas != '[]' }}
    # Lambdas compile via cargo-lambda inside the dev shell (not crane), so they
    # ride two warm caches: the /nix sticky disk (instant dev shell from
    # warm-deps) and a per-service cargo target sticky disk (compiled deps warm
    # across runs). Per-service target keys avoid cross-job contention.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        service: ${{ fromJson(needs.setup.outputs.lambdas) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Mount Nix store sticky disk (clones warmed snapshot)
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-store
          path: /nix

      - name: Mount cargo target sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-lambda-target-${{ matrix.service }}
          path: ${{ github.workspace }}/rust/cloud-storage/target

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Configure Cachix fallback substituter
        uses: ./.github/actions/setup-cachix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET || secrets.SCCACHE_BUCKET }}

      - name: Build Lambda artifacts
        env:
          SERVICE: ${{ matrix.service }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/build-cloud-storage-lambdas.sh

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-storage-lambdas-${{ matrix.service }}-${{ github.sha }}
          path: lambda-artifacts.tar.gz
          retention-days: 7

  migrate-db:
    name: Run Database Migrations
    runs-on: db-migrator
    needs: [build-service-binaries, build-lambda-artifacts]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: .github/
      - name: Run migrations
        uses: ./.github/actions/migrate-cloud-storage-db
        with:
          environment: ${{ inputs.environment }}

  deploy-services:
    name: Deploy ${{ matrix.service }}
    needs: [setup, build-service-binaries, build-lambda-artifacts, migrate-db]
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    runs-on:
      [
        runs-on,
        runner=8cpu-linux-x64,
        hdd=40,
        spot=false,
        ssh=false,
        'run-id=${{github.run_id}}-${{ matrix.service }}',
      ]
    strategy:
      fail-fast: false
      max-parallel: 20  # Limit concurrent deployments
      matrix:
        service: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Get project name
        id: project-name
        uses: ./.github/actions/get-project-name
        with:
          service-name: ${{ matrix.service }}

      - name: Check artifact config
        id: check-artifacts
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          has_binaries=$(jq -r --arg service "$SERVICE" '((.services[$service].deploy_binaries // []) | length) > 0' .github/services-config.json)
          has_lambdas=$(jq -r --arg service "$SERVICE" '((.services[$service].deploy_lambdas // []) | length) > 0' .github/services-config.json)
          echo "has_binaries=$has_binaries" >> "$GITHUB_OUTPUT"
          echo "has_lambdas=$has_lambdas" >> "$GITHUB_OUTPUT"

      - name: Deploy ${{ matrix.service }}
        uses: ./.github/actions/deploy-cloud-storage-pulumi
        with:
          environment: ${{ inputs.environment }}
          aws-access-key: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          pulumi-service-name: ${{ steps.project-name.outputs.project-name }}
          prebuilt-binaries-artifact: ${{ steps.check-artifacts.outputs.has_binaries == 'true' && format('cloud-storage-service-binaries-{0}-{1}', matrix.service, github.sha) || '' }}
          lambda-artifacts: ${{ steps.check-artifacts.outputs.has_lambdas == 'true' && format('cloud-storage-lambdas-{0}-{1}', matrix.service, github.sha) || '' }}
          dd-app-key: ${{ secrets.DD_APP_KEY }}
          dd-api-key: ${{ secrets.DD_API_KEY }}

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [setup, warm-deps, build-service-binaries, build-lambda-artifacts, deploy-services]
    if: always()
    steps:
      - name: Check deployment results
        run: |
          if [[ "${{ needs.setup.result }}" == "failure" ]]; then
            echo "❌ Deployment setup failed"
            exit 1
          elif [[ "${{ needs.setup.result }}" == "skipped" ]]; then
            echo "⏭️ Deployment setup was skipped"
          elif [[ "${{ needs.warm-deps.result }}" == "failure" ]]; then
            echo "❌ Warming shared Rust deps onto the sticky disk failed"
            exit 1
          elif [[ "${{ needs.build-service-binaries.result }}" == "failure" ]]; then
            echo "❌ One or more service binary builds failed"
            exit 1
          elif [[ "${{ needs.build-lambda-artifacts.result }}" == "failure" ]]; then
            echo "❌ One or more Lambda artifact builds failed"
            exit 1
          elif [[ "${{ needs.deploy-services.result }}" == "failure" ]]; then
            echo "❌ One or more service deployments failed"
            exit 1
          elif [[ "${{ needs.deploy-services.result }}" == "skipped" ]]; then
            echo "⏭️ No services to deploy"
          else
            echo "✅ All service deployments completed successfully for ${{ inputs.environment }} environment"
          fi
